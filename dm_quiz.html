<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบทดสอบ Data Mining บท 1-5</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d8dce3;--ac:#2f7d32;--ok:#d8f3dc;--no:#fde0e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#343b47;--ac:#6fcf76;--ok:#1f4a28;--no:#552626}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232b;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#343b47;--ac:#6fcf76;--ok:#1f4a28;--no:#552626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Thai",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.rst{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:6px 12px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sc{color:var(--mut);font-size:14px;margin-top:6px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.q p{margin:0 0 8px;font-weight:600}
.o{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:9px 10px;margin:5px 0;font-size:15px}
.o.ok{background:var(--ok)}.o.no{background:var(--no)}
</style></head><body><main>

<div class="bar"><div class="tabs" id="tabs"></div><div class="sc" id="sc"></div></div>
<div id="list"></div>
<button class="rst" onclick="start()">เริ่มใหม่ (สลับข้อ)</button>
</main>

["3","ในกรณีศึกษา คลาส GOOD หมายถึง","จบด้วย GPA อยู่ใน 40% แรก","GPA สูงสุดของภาค","ไม่ติด F","GPA ≥ 3.5"],
["3","ค่าที่ใช้ประเมินโมเดลในขั้น Evaluation ได้แก่","Precision, Recall, F-measure, Accuracy","Entropy, Gain","Mean, Median","Min, Max"],
["3","หลัง Deployment ควรทำอะไร","ปรับปรุงโมเดลเป็นระยะ (Periodic Update)","หยุดทำเหมืองข้อมูล","ลบข้อมูลเดิม","ไม่ต้องทำอะไร"],
["3","'What will happen?' คือ analytics แบบใด","Predictive","Descriptive","Prescriptive","Diagnostic"],

["4","วิธีจัดการข้อมูลรบกวน (noise) ได้แก่","Binning, Regression, Clustering","Ignore the tuple","Normalization","Decimal scaling"],
["4","Min-max normalization (0–1) ถ้า min=10, max=50, v=30 จะได้","0.5","0.6","0.3","1.0"],
["4","Decimal scaling ค่าสัมบูรณ์สูงสุด 999 (หาร 1000) ค่า -999 เป็น","-0.999","-9.99","-0.0999","-1.999"],

["5","เทคนิคใดเป็น Clustering","K-Means","K-NN","Decision Tree","Naive Bayes"],
["5","ส่วนของ Decision Tree ที่เป็นผลลัพธ์/คลาส","ใบ (Leaf)","ราก (Root)","กิ่ง (Branch)","โหนดบนสุด"],

["5","Information Gain = ?","Entropy(before) − Entropy(after)","Entropy(after) − Entropy(before)","Entropy × Gain","Entropy / S"],

["5","ข้อมูล Play Golf 14 วัน (Yes 9, No 5) Entropy ≈","0.940","0.5","1.0","0"],
["5","จำแนกอีเมลเป็นสแปม/ปกติ 'คลาส' คือ","สแปม และ ปกติ","เนื้อหาอีเมล","ผู้ส่ง","จำนวนคำ"],
["5","ข้อดีของ Decision Tree","แปลความหมายง่าย และแปลงเป็นกฎได้","ใช้ข้อมูลน้อยที่สุด","เป็น unsupervised","แม่นยำที่สุดเสมอ"],
["5","ข้อใดเป็นเทคนิค Classification ทั้งหมด","Decision Tree, Naive Bayes, Neural Network, K-NN","K-Means, Apriori","Decision Tree, K-Means","Time Series, K-Means"],
["5","Machine Learning คือ","ระบบเรียนรู้รูปแบบจากข้อมูลเอง (สาขาย่อยของ AI)","โปรแกรมจัดการฐานข้อมูล","ขั้นตอน ETL","เครื่องมือสร้างรายงาน"]
];
const T=[["all","ทั้งหมด"],["1","บท 1"],["2","บท 2"],["3","บท 3"],["4","บท 4"],["5","บท 5"]];
let cur="all",done=0,right=0,items=[];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function start(){
 const pool=Q.filter(q=>cur=="all"||q[0]==cur);
 items=sh(pool).map(q=>({q:q[1],o:sh(q.slice(2).map((t,i)=>({t,c:i==0})))}));
 done=0;right=0;draw();
}
function draw(){
 document.getElementById("tabs").innerHTML=T.map(t=>`<button class="${t[0]==cur?"on":""}" onclick="cur='${t[0]}';start()">${t[1]}</button>`).join("");
 document.getElementById("list").innerHTML=items.map((it,n)=>`<div class="q"><p>${n+1}. ${it.q}</p>${it.o.map((o,k)=>`<button class="o" id="o${n}_${k}" onclick="pick(${n},${k})">${o.t}</button>`).join("")}</div>`).join("");
 sc();
}
function sc(){document.getElementById("sc").textContent=`ตอบแล้ว ${done}/${items.length} · ถูก ${right}`}
function pick(n,k){
 const it=items[n];if(it.d)return;it.d=1;done++;
 it.o.forEach((o,i)=>{const b=document.getElementById(`o${n}_${i}`);if(o.c)b.classList.add("ok");else if(i==k)b.classList.add("no")});
 if(it.o[k].c)right++;sc();
}
start();
</script></body></html>
