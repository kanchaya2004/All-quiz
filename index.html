  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQuiz(){
  quizData=shuffle(questions);
  const form=document.getElementById('quiz');
  form.innerHTML='';
  quizData.forEach((q,i)=>{
    const options=q[2].map((text,idx)=>({text,correct:idx===q[3]}));
    const shuffled=shuffle(options);
    const card=document.createElement('div');
    card.className='question-card';
    card.innerHTML=`<div class="qnum">${q[0]} • ข้อ ${i+1}/100</div>
      <div class="question">${i+1}. ${q[1]}</div>
      <div>${shuffled.map((o,j)=>`
        <label><input type="radio" name="q${i}" value="${j}" data-correct="${o.correct}">
        ${String.fromCharCode(65+j)}. ${o.text}</label>`).join('')}</div>`;
    form.appendChild(card);
  });
  form.addEventListener('change',updateProgress);
}
function updateProgress(){
  let n=0;
  quizData.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++;});
  document.getElementById('count').textContent=n;
  document.getElementById('bar').style.width=(n)+'%';
}
function submitQuiz(){
  if(submitted)return;
  let score=0, unanswered=0, review=[];
  quizData.forEach((q,i)=>{
    const checked=document.querySelector(`input[name=q${i}]:checked`);
    if(!checked){unanswered++;return;}
    if(checked.dataset.correct==='true')score++;
    else{
      const correct=[...document.querySelectorAll(`input[name=q${i}]`)].find(x=>x.dataset.correct==='true');
      const labels=[...document.querySelectorAll(`input[name=q${i}]`)];
      const selectedLabel=checked.parentElement.textContent.trim();
      const correctLabel=correct.parentElement.textContent.trim();
      review.push({i,q,selectedLabel,correctLabel});
    }
  });
  if(unanswered>0){
    alert(`ยังไม่ได้ตอบ ${unanswered} ข้อ กรุณาตอบให้ครบก่อนส่งคำตอบ`);
    return;
  }
  submitted=true;
  document.querySelectorAll('input').forEach(x=>x.disabled=true);
  let percent=score;
  let grade=score>=80?'ยอดเยี่ยม 🔥':score>=70?'ดีมาก 💪':score>=60?'ผ่านเกณฑ์ 👍':'ควรทบทวนเพิ่ม 📚';
  let html=`<h2>🎯 คะแนนของคุณ: ${score}/100 (${percent}%)</h2>
  <p><b>ผลประเมิน:</b> ${grade}</p>
  <p>ตอบถูก ${score} ข้อ • ตอบผิด ${100-score} ข้อ</p>`;
  if(review.length){
    html+=`<hr><h3>🔎 ข้อที่ตอบผิด</h3>`;
    review.forEach(r=>{
      html+=`<div class="wrong"><b>ข้อ ${r.i+1}: ${r.q[1]}</b><br>
      คุณตอบ: ${r.selectedLabel}<br>
      <span class="correct">เฉลย: ${r.correctLabel}</span></div>`;
    });
  }else html+=`<p class="correct"><b>🎉 ถูกครบ 100 ข้อ!</b></p>`;
  html+=`<button class="primary" onclick="location.reload()">🔄 ทำชุดใหม่</button>`;
  const result=document.getElementById('result');
  result.innerHTML=html;
  result.style.display='block';
  result.scrollIntoView({behavior:'smooth'});
}
buildQuiz();
</script>
